definitions:
  environment: &env
    flutter: 3.50.1
    xcode: latest
  changeset: &changeset
    includes:
      - 'lib/**'
      - 'ios/**'
      - 'android/**'
      - pubspec.yaml
      - pubspec.lock
      - codemagic.yaml
    excludes:
      - '**/*.md'
  triggering: &triggering
    events:
      - push
    branch_patterns:
      - pattern: main
        include: true
    cancel_previous_builds: true

workflows:
  ios-unsigned:
    name: iOS IPA chưa ký
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment: *env
    triggering: *triggering
    when:
      changeset: *changeset
    scripts:
      - name: flutter pub get
        script: flutter pub get
      - name: Build iOS không ký
        script: flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER"
      - name: Đóng gói IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa/Payload"
          cd "$CM_BUILD_DIR/build/ios/ipa"
          cp -R ../iphoneos/Runner.app Payload/
          zip -qry "TtydKeys-$BUILD_NUMBER-unsigned.ipa" Payload
    artifacts:
      - build/ios/ipa/*.ipa

  android-apk:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: 3.50.1
    triggering: *triggering
    when:
      changeset: *changeset
    scripts:
      - name: flutter pub get
        script: flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --build-number="$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/TtydKeys-$BUILD_NUMBER.apk"
    artifacts:
      - build/app/outputs/flutter-apk/TtydKeys-*.apk
