# iOS: tự build khi push main. Android build theo yêu cầu: build-android.yml (make android-apk).
name: build

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'ios/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Đóng gói IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry "TtydKeys-${{ github.run_number }}-${GITHUB_SHA::7}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ttyd-keys-ios
          path: build/ios/ipa/*.ipa
          retention-days: 14
